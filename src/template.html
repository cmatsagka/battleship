<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>battleship</title>
	</head>
	<body>
		<header>
			<h1>battleship</h1>
			<div class="message-container">
				<p id="human-message" class="message"></p>
				<p id="comp-message" class="message"></p>
			</div>
			<button id="restart-btn" class="hidden">Play Again</button>
		</header>
		<main>
			<div class="setup-container">
				<div class="setup-controls">
					<button id="random-p1-btn">Randomize Fleet</button>
					<button id="start-match-btn" class="hidden">
						Commit Fleet & Start
					</button>
				</div>
			</div>
			<div class="boards-container">
				<div class="section player">
					<h2>Player's board</h2>
					<div id="human-board" class="board"></div>
				</div>
				<div class="section computer">
					<h2>Computer's board</h2>
					<div id="comp-board" class="board"></div>
				</div>
			</div>
		</main>
		<footer class="site-footer">
			<p>Build with care and vanilla</p>
		</footer>
	</body>
</html>
